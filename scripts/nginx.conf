user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# CMX 管理门户（新增，2026-09-12）
	# 整站反代门户后端 cmx-portal-server（:8080）：
	#   管理门户前端 = /portal/（构建 base 固定），接口 = /api，文件直出 = /files
	# 访问入口：http://<服务器IP>:81/portal/（端口不对改下面 listen 一处即可；
	# 后端不在本机时把 proxy_pass 里的 127.0.0.1 换成后端机器 IP）
	##

	# WebSocket / SSE 升级映射（Connection 头按请求是否有 Upgrade 取值）
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server {
		listen 81;
		server_name _;

		# 门户 /files 上传上限 100MB，这里放开请求体限制避免 nginx 先拦
		client_max_body_size 200m;

		# 直连根路径时跳到管理门户
		location = / {
			return 302 /portal/;
		}

		location / {
			proxy_pass http://127.0.0.1:8080;
			proxy_http_version 1.1;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# WebSocket / SSE 通路
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;

			# SSE 流式响应不缓冲，读超时放宽
			proxy_buffering off;
			proxy_read_timeout 300s;
		}
	}

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


