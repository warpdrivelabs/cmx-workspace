</defs><rect x="0" y="0" width="970" height="300" rx="16" fill="#fcfcfb" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="485" y="34" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="800" fill="#0b0b0b" text-anchor="middle" opacity="1">落地演进路径</text><text x="485" y="55" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" opacity="1">不要一次建大：先核心 + 一域跑通，再联邦扩张</text><rect x="40" y="92" width="210.5" height="150" rx="12" fill="#4a3aa7" fill-opacity="0.08" stroke="#4a3aa7" stroke-opacity="0.36" stroke-width="1.2"/><rect x="40" y="92" width="210.5" height="34" rx="12" fill="#4a3aa7" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="40" y="114" width="210.5" height="12" rx="10" fill="#4a3aa7" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="54" y="114" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="800" fill="#4a3aa7" text-anchor="start" opacity="1">P0 · 核心内核</text><text x="54" y="146" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">客户/供应商/商品/组织/员工 + 参照数</text><text x="54" y="161" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">据；定义共享接口。</text><rect x="52" y="212" width="117" height="20" rx="10" fill="#4a3aa7" fill-opacity="0.13" stroke="#4a3aa7" stroke-opacity="0.34" stroke-width="1"/><circle cx="61" cy="222" r="3" fill="#4a3aa7"/><text x="68" y="226" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="start" opacity="1">1 个核心 namespace</text><line x1="252.5" y1="167" x2="264.5" y2="167" stroke="#4a3aa7" stroke-width="1.6" marker-end="url(#arr)"/><rect x="266.5" y="92" width="210.5" height="150" rx="12" fill="#2a78d6" fill-opacity="0.08" stroke="#2a78d6" stroke-opacity="0.36" stroke-width="1.2"/><rect x="266.5" y="92" width="210.5" height="34" rx="12" fill="#2a78d6" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="266.5" y="114" width="210.5" height="12" rx="10" fill="#2a78d6" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="280.5" y="114" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="800" fill="#2a78d6" text-anchor="start" opacity="1">P1 · 首个领域</text><text x="280.5" y="146" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">选高价值域(如财务)建本体，引用核心；</text><text x="280.5" y="161" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">O3 灌真实数据；跑通 Search-Around</text><text x="280.5" y="176" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">。</text><rect x="278.5" y="212" width="105" height="20" rx="10" fill="#2a78d6" fill-opacity="0.13" stroke="#2a78d6" stroke-opacity="0.34" stroke-width="1"/><circle cx="287.5" cy="222" r="3" fill="#2a78d6"/><text x="294.5" y="226" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="start" opacity="1">core + 1 domain</text><line x1="479" y1="167" x2="491" y2="167" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#arr)"/><rect x="493" y="92" width="210.5" height="150" rx="12" fill="#1baf7a" fill-opacity="0.08" stroke="#1baf7a" stroke-opacity="0.36" stroke-width="1.2"/><rect x="493" y="92" width="210.5" height="34" rx="12" fill="#1baf7a" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="493" y="114" width="210.5" height="12" rx="10" fill="#1baf7a" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="507" y="114" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="800" fill="#1baf7a" text-anchor="start" opacity="1">P2 · 多域联邦</text><text x="507" y="146" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">横向扩销售/供应链/HR；各域独立发布；</text><text x="507" y="161" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">跨域链路打通。</text><rect x="505" y="212" width="110" height="20" rx="10" fill="#1baf7a" fill-opacity="0.13" stroke="#1baf7a" stroke-opacity="0.34" stroke-width="1"/><circle cx="514" cy="222" r="3" fill="#1baf7a"/><text x="521" y="226" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="start" opacity="1">core + N domains</text><line x1="705.5" y1="167" x2="717.5" y2="167" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="719.5" y="92" width="210.5" height="150" rx="12" fill="#eb6834" fill-opacity="0.08" stroke="#eb6834" stroke-opacity="0.36" stroke-width="1.2"/><rect x="719.5" y="92" width="210.5" height="34" rx="12" fill="#eb6834" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="719.5" y="114" width="210.5" height="12" rx="10" fill="#eb6834" fill-opacity="0.16" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="733.5" y="114" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="800" fill="#eb6834" text-anchor="start" opacity="1">P3 · 治理与联邦查询</text><text x="733.5" y="146" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">分域权限(O6)、版本发布、跨域联邦查询</text><text x="733.5" y="161" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">、血缘与影响分析。</text><rect x="731.5" y="212" width="77" height="20" rx="10" fill="#eb6834" fill-opacity="0.13" stroke="#eb6834" stroke-opacity="0.34" stroke-width="1"/><circle cx="740.5" cy="222" r="3" fill="#eb6834"/><text x="747.5" y="226" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" font-weight="400" fill="#0b0b0b" text-anchor="start" opacity="1">governance</text></svg>