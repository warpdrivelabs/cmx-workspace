</defs><rect x="0" y="0" width="940" height="384" rx="16" fill="#fcfcfb" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="470" y="34" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="19" font-weight="800" fill="#0b0b0b" text-anchor="middle" opacity="1">错误 × 执行模式 · 处理矩阵</text><text x="470" y="54" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle" opacity="1">同一决策调用，按「返回类型 × 同步/异步」决定落到续流 / 错误边界 / Incident / 死信</text><rect x="40" y="74" width="300" height="30" rx="6" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="52" y="94" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#52514e" text-anchor="start" opacity="1">返回类型 ＼ 执行模式</text><rect x="342" y="74" width="276" height="30" rx="6" fill="#1baf7a" fill-opacity="0.14" stroke="#1baf7a" stroke-opacity="0.36" stroke-width="1"/><text x="480" y="94" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#1baf7a" text-anchor="middle" opacity="1">同步 serviceTask</text><rect x="622" y="74" width="276" height="30" rx="6" fill="#4a3aa7" fill-opacity="0.14" stroke="#4a3aa7" stroke-opacity="0.36" stroke-width="1"/><text x="760" y="94" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" fill="#4a3aa7" text-anchor="middle" opacity="1">异步 serviceTask（flowable:async）</text><rect x="40" y="108" width="300" height="36" rx="6" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="52" y="128" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="start" opacity="1">成功（code==0）</text><rect x="342" y="108" width="276" height="36" rx="6" fill="#0ca30c" fill-opacity="0.14" stroke="#0ca30c" stroke-opacity="0.34" stroke-width="1"/><rect x="342" y="108" width="3" height="36" rx="1.5" fill="#0ca30c" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="482" y="128" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">merge output + 续流</text><rect x="622" y="108" width="276" height="36" rx="6" fill="#0ca30c" fill-opacity="0.14" stroke="#0ca30c" stroke-opacity="0.34" stroke-width="1"/><rect x="622" y="108" width="3" height="36" rx="1.5" fill="#0ca30c" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="762" y="128" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">merge output + 续流</text><rect x="40" y="148" width="300" height="36" rx="6" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="52" y="168" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="start" opacity="1">业务失败（HTTP 200, code≠0）</text><rect x="342" y="148" width="276" height="36" rx="6" fill="#fab219" fill-opacity="0.14" stroke="#fab219" stroke-opacity="0.34" stroke-width="1"/><rect x="342" y="148" width="3" height="36" rx="1.5" fill="#fab219" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="482" y="168" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Bpmn → 错误边界</text><rect x="622" y="148" width="276" height="36" rx="6" fill="#fab219" fill-opacity="0.14" stroke="#fab219" stroke-opacity="0.34" stroke-width="1"/><rect x="622" y="148" width="3" height="36" rx="1.5" fill="#fab219" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="762" y="168" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Bpmn → 错误边界*</text><rect x="40" y="188" width="300" height="36" rx="6" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="52" y="208" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="start" opacity="1">未知 key（HTTP 404）</text><rect x="342" y="188" width="276" height="36" rx="6" fill="#d03b3b" fill-opacity="0.08" stroke="#d03b3b" stroke-opacity="0.34" stroke-width="1"/><rect x="342" y="188" width="3" height="36" rx="1.5" fill="#d03b3b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="482" y="208" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Generic → Incident</text><rect x="622" y="188" width="276" height="36" rx="6" fill="#d03b3b" fill-opacity="0.08" stroke="#d03b3b" stroke-opacity="0.34" stroke-width="1"/><rect x="622" y="188" width="3" height="36" rx="1.5" fill="#d03b3b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="762" y="208" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Incident</text><rect x="40" y="228" width="300" height="36" rx="6" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="52" y="248" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="start" opacity="1">鉴权失败（HTTP 401）</text><rect x="342" y="228" width="276" height="36" rx="6" fill="#d03b3b" fill-opacity="0.08" stroke="#d03b3b" stroke-opacity="0.34" stroke-width="1"/><rect x="342" y="228" width="3" height="36" rx="1.5" fill="#d03b3b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="482" y="248" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Generic → Incident</text><rect x="622" y="228" width="276" height="36" rx="6" fill="#d03b3b" fill-opacity="0.08" stroke="#d03b3b" stroke-opacity="0.34" stroke-width="1"/><rect x="622" y="228" width="3" height="36" rx="1.5" fill="#d03b3b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="762" y="248" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Incident</text><rect x="40" y="268" width="300" height="36" rx="6" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="52" y="288" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" font-weight="700" fill="#0b0b0b" text-anchor="start" opacity="1">超时 / 连接失败</text><rect x="342" y="268" width="276" height="36" rx="6" fill="#d03b3b" fill-opacity="0.08" stroke="#d03b3b" stroke-opacity="0.34" stroke-width="1"/><rect x="342" y="268" width="3" height="36" rx="1.5" fill="#d03b3b" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="482" y="288" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">Generic → Incident</text><rect x="622" y="268" width="276" height="36" rx="6" fill="#fab219" fill-opacity="0.14" stroke="#fab219" stroke-opacity="0.34" stroke-width="1"/><rect x="622" y="268" width="3" height="36" rx="1.5" fill="#fab219" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="762" y="288" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" opacity="1">自动重试(3×/30s)→死信</text><rect x="40" y="316" width="860" height="34" rx="8" fill="#f4f4f1" fill-opacity="1" stroke="rgba(11,11,11,0.12)" stroke-opacity="1" stroke-width="1"/><text x="54" y="331" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#52514e" text-anchor="start" opacity="1">* 异步模式下 delegate 失败默认走「重试/死信」而非错误边界（引擎约定）；若需异步业务失败也走错误边界，需在 P2 接缝层显式路由。</text><text x="54" y="345" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.6" font-weight="400" fill="#898781" text-anchor="start" opacity="1">超时阈值走 cmx-service-rpc 配置（建议 2–5s）；大图/Rhai 重规则一律用 flowable:async 以免阻塞令牌线程。</text></svg>