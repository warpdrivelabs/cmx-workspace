<svg viewBox="0 0 820 336" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
  </marker>
  <filter id="s3" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="336" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">核心范式：部分求值 —— 已知的代入求值，未知的留成约束</text>

<!-- 输入 -->
<g filter="url(#s3)">
<rect x="30" y="78" width="150" height="52" rx="9" fill="#eef2ff" stroke="#6366f1"/>
<rect x="30" y="146" width="150" height="52" rx="9" fill="#ecfeff" stroke="#06b6d4"/>
</g>
<text x="105" y="100" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">Subject 主体</text>
<text x="105" y="119" font-size="10.5" fill="#4338ca" text-anchor="middle">user=u42 · org∈{华东}</text>
<text x="105" y="168" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">Resource 资源</text>
<text x="105" y="187" font-size="10.5" fill="#0e7490" text-anchor="middle">凭证 voucher · 读</text>

<!-- PDP -->
<g filter="url(#s3)"><rect x="240" y="96" width="150" height="84" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/></g>
<text x="315" y="128" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="middle">PDP</text>
<text x="315" y="150" font-size="11" fill="#6d28d9" text-anchor="middle">策略引擎</text>
<text x="315" y="168" font-size="11" fill="#6d28d9" text-anchor="middle">部分求值</text>

<!-- 残差气泡 -->
<g filter="url(#s3)"><rect x="446" y="86" width="330" height="104" rx="10" fill="#faf5ff" stroke="#a855f7"/></g>
<text x="462" y="110" font-size="12" font-weight="700" fill="#7e22ce">残差 · 约束 AST</text>
<text x="462" y="134" font-size="11.5" fill="#6b21a8" font-family="ui-monospace,Menlo,Consolas,monospace">dept_id IN [1001,1002]</text>
<text x="462" y="154" font-size="11.5" fill="#6b21a8" font-family="ui-monospace,Menlo,Consolas,monospace">  AND ( owner = 'u42'</text>
<text x="462" y="174" font-size="11.5" fill="#6b21a8" font-family="ui-monospace,Menlo,Consolas,monospace">        OR status = 'public' )</text>

<line x1="180" y1="104" x2="240" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="180" y1="172" x2="240" y2="156" stroke="#64748b" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="390" y1="138" x2="446" y2="138" stroke="#64748b" stroke-width="1.6" marker-end="url(#a3)"/>

<!-- PEP + 数据 -->
<g filter="url(#s3)">
<rect x="446" y="222" width="150" height="72" rx="10" fill="#ecfeff" stroke="#06b6d4"/>
<rect x="640" y="222" width="136" height="72" rx="10" fill="#ecfdf5" stroke="#10b981"/>
</g>
<text x="521" y="252" font-size="13" font-weight="700" fill="#155e75" text-anchor="middle">PEP</text>
<text x="521" y="274" font-size="10.5" fill="#0e7490" text-anchor="middle">编译并执行约束</text>
<text x="708" y="252" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">过滤后数据</text>
<text x="708" y="274" font-size="10.5" fill="#047857" text-anchor="middle">只剩可见行</text>
<line x1="560" y1="190" x2="540" y2="222" stroke="#64748b" stroke-width="1.6" marker-end="url(#a3)"/>
<line x1="596" y1="258" x2="640" y2="258" stroke="#64748b" stroke-width="1.6" marker-end="url(#a3)"/>

<text x="40" y="316" font-size="11" fill="#64748b">PDP 只用“已知上下文”（主体维度）求值；资源里尚不知的字段（owner/status/dept_id）保留为符号 → 得到残差约束，交由 PEP 就地执行。</text>
</svg>