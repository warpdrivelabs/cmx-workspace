<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <filter id="s13" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">L3 物化权限集缓存 · 授权时算好、查询直取（空间换时间）</text>

<!-- 惰性下推（对照，上带）-->
<rect x="30" y="52" width="760" height="66" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="74" font-size="12" font-weight="700" fill="#64748b">惰性下推（L1/L2，大表）</text>
<text x="46" y="98" font-size="11.5" fill="#64748b">前端查询 → decide → compile → 拼 WHERE 下推查库　·　每次现算　·　适百万行大表</text>
<rect x="600" y="66" width="176" height="38" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="688" y="90" font-size="11.5" fill="#4338ca" text-anchor="middle">大表 → 走这条</text>

<!-- 急切物化主流程 -->
<text x="40" y="146" font-size="13" font-weight="700" fill="#7e22ce">急切物化（L3，小字典：组织机构 / 成本中心 / 项目）</text>

<!-- 分配 -->
<g filter="url(#s13)"><rect x="30" y="160" width="150" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b"/></g>
<text x="105" y="188" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">① 分配权限</text>
<text x="105" y="208" font-size="10.5" fill="#b45309" text-anchor="middle">给 role / user</text>
<text x="105" y="223" font-size="10.5" fill="#b45309" text-anchor="middle">授某 org 子树</text>

<!-- 物化器 -->
<g filter="url(#s13)"><rect x="220" y="160" width="180" height="72" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/></g>
<text x="310" y="184" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">② 物化器</text>
<text x="310" y="204" font-size="10.5" fill="#6d28d9" text-anchor="middle">根值 → descendants</text>
<text x="310" y="220" font-size="10.5" fill="#6d28d9" text-anchor="middle">(WITH RECURSIVE 并集)</text>

<!-- 缓存 -->
<g filter="url(#s13)"><rect x="440" y="150" width="340" height="94" rx="10" fill="#ecfdf5" stroke="#10b981"/></g>
<text x="456" y="172" font-size="12.5" font-weight="700" fill="#065f46">③ 权限集缓存（键=principal）</text>
<rect x="456" y="182" width="308" height="24" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
<text x="464" y="199" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">role:finance → [1001,100101,100102,…]</text>
<rect x="456" y="210" width="308" height="24" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
<text x="464" y="227" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">user:u42 → [2001,2002]</text>

<line x1="180" y1="196" x2="220" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#a13)"/>
<line x1="400" y1="196" x2="440" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#a13)"/>

<!-- 查询直取 -->
<g filter="url(#s13)"><rect x="30" y="286" width="180" height="72" rx="10" fill="#ecfeff" stroke="#06b6d4"/></g>
<text x="120" y="314" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">④ 前端查字典</text>
<text x="120" y="334" font-size="10.5" fill="#0e7490" text-anchor="middle">带主体 → 直取缓存</text>
<text x="120" y="350" font-size="10.5" fill="#0e7490" text-anchor="middle">用∪各角色集，可不碰库</text>
<line x1="560" y1="244" x2="180" y2="286" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a13)"/>
<text x="250" y="266" font-size="10" fill="#64748b" font-style="italic">O(1) 命中</text>

<!-- 失效回路 -->
<g filter="url(#s13)"><rect x="250" y="286" width="200" height="72" rx="10" fill="#fef2f2" stroke="#ef4444"/></g>
<text x="350" y="314" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">⑤ 重分配 → 刷新</text>
<text x="350" y="334" font-size="10.5" fill="#b91c1c" text-anchor="middle">只失效该 principal 键</text>
<text x="350" y="350" font-size="10.5" fill="#b91c1c" text-anchor="middle">下次查询重算最新集</text>
<line x1="350" y1="286" x2="330" y2="244" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a13)"/>

<!-- 判据 -->
<g filter="url(#s13)"><rect x="490" y="286" width="290" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="506" y="308" font-size="11.5" font-weight="700" fill="#334155">适用判据</text>
<text x="506" y="328" font-size="10.5" fill="#475569">✓ 枚举可穷尽的小字典 · 读多写少 · 变更低频</text>
<text x="506" y="346" font-size="10.5" fill="#b91c1c">✗ 大表（集合会爆炸）→ 仍走 L1/L2 惰性下推</text>

<text x="40" y="390" font-size="11" fill="#64748b">载体：M1 进程内 OnceLock&lt;Mutex&lt;HashMap&gt;&gt;；生产换 Redis（跨实例共享 + TTL 兜底）。物化与惰性共用同一维度展开内核，只是把结果固化。</text>
<text x="40" y="412" font-size="11" fill="#64748b">用户有效可见集 = cache[user:自身] ∪ cache[role:各角色]（去重）；给某角色重分配只失效一个键，其全体成员自动取到最新。</text>
<text x="40" y="434" font-size="11" fill="#64748b">超管 / 授"全部"（根值含 *）→ 物化为全量字典。</text>
</svg>