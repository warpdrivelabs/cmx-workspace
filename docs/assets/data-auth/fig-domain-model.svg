<rect x="0" y="0" width="820" height="432" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">领域模型：decide(Subject, Resource) → Decision（内含约束 AST + 义务）</text>
<g filter="url(#s5)"><rect x="30" y="58" width="352" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/></g>
<rect x="30" y="58" width="352" height="30" rx="10" fill="#6366f1" fill-opacity="0.18"/>
<text x="46" y="78" font-size="10.5" fill="#3730a3" font-style="italic">« 主体上下文 »</text>
<text x="366" y="78" font-size="13" font-weight="700" fill="#3730a3" text-anchor="end">Subject</text>
<text x="46" y="118" font-size="11" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">tenant · user_id</text>
<text x="46" y="139" font-size="11" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">roles: [finance, approver]</text>
<text x="46" y="160" font-size="11" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">dims: { org:[1001,1002],</text>
<text x="46" y="181" font-size="11" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">       proj:[P-2201] }</text>
<text x="46" y="202" font-size="11" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">attrs: { grade:7, region:'east' }</text>

<g filter="url(#s5)"><rect x="438" y="58" width="352" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4"/></g>
<rect x="438" y="58" width="352" height="30" rx="10" fill="#06b6d4" fill-opacity="0.18"/>
<text x="454" y="78" font-size="10.5" fill="#155e75" font-style="italic">« 资源描述符 »</text>
<text x="774" y="78" font-size="13" font-weight="700" fill="#155e75" text-anchor="end">Resource</text>
<text x="454" y="118" font-size="11" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">kind: “voucher”</text>
<text x="454" y="139" font-size="11" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">action: Read | Write | Export</text>
<text x="454" y="160" font-size="11" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">dim_bindings:</text>
<text x="454" y="181" font-size="11" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">  org → col ou_id</text>
<text x="454" y="202" font-size="11" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">row_ctx: { owner, status, amount }</text>

<g filter="url(#s5)"><rect x="30" y="252" width="352" height="150" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/></g>
<rect x="30" y="252" width="352" height="30" rx="10" fill="#8b5cf6" fill-opacity="0.18"/>
<text x="46" y="272" font-size="10.5" fill="#5b21b6" font-style="italic">« 决策结果 »</text>
<text x="366" y="272" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="end">Decision</text>
<text x="46" y="312" font-size="11" fill="#5b21b6" font-family="ui-monospace,Menlo,Consolas,monospace">effect: PermitWithConstraint</text>
<text x="46" y="333" font-size="11" fill="#5b21b6" font-family="ui-monospace,Menlo,Consolas,monospace">constraint: &lt;约束 AST&gt;</text>
<text x="46" y="354" font-size="11" fill="#5b21b6" font-family="ui-monospace,Menlo,Consolas,monospace">obligations:</text>
<text x="46" y="375" font-size="11" fill="#5b21b6" font-family="ui-monospace,Menlo,Consolas,monospace">  [ mask(id_card), mask(salary) ]</text>
<text x="46" y="396" font-size="11" fill="#5b21b6" font-family="ui-monospace,Menlo,Consolas,monospace">trace: 命中规则 / 展开维度</text>

<g filter="url(#s5)"><rect x="438" y="252" width="352" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/></g>
<rect x="438" y="252" width="352" height="30" rx="10" fill="#94a3b8" fill-opacity="0.18"/>
<text x="454" y="272" font-size="10.5" fill="#334155" font-style="italic">« 残差 · IR »</text>
<text x="774" y="272" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Constraint  (enum)</text>
<text x="454" y="312" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">True | False</text>
<text x="454" y="333" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">And(cs) | Or(cs) | Not(c)</text>
<text x="454" y="354" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Cmp{field,op,value}</text>
<text x="454" y="375" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">In{field,values}</text>
<text x="454" y="396" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Relation{field,rel,subject} ←ReBAC</text>

<line x1="210" y1="208" x2="205" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#a5)"/>
<line x1="500" y1="208" x2="240" y2="255" stroke="#64748b" stroke-width="1.4" marker-end="url(#a5)"/>
<text x="250" y="238" font-size="11" font-weight="700" fill="#475569">decide()</text>
<line x1="382" y1="330" x2="438" y2="330" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a5)"/>
