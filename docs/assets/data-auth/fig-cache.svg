<svg viewBox="0 0 820 316" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <filter id="s11" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="316" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">两级缓存 · 决策缓存 + 编译产物缓存 · 失效时机</text>

<g filter="url(#s11)">
<rect x="30" y="56" width="356" height="220" rx="12" fill="#eef2ff" stroke="#6366f1"/>
<rect x="434" y="56" width="356" height="220" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
</g>

<text x="208" y="82" font-size="13.5" font-weight="700" fill="#3730a3" text-anchor="middle">L1 — 决策缓存</text>
<text x="46" y="104" font-size="11.5" fill="#4338ca">键：hash(tenant, user_id, resource_kind, action)</text>
<text x="46" y="124" font-size="11.5" fill="#4338ca">值：Decision JSON（constraint + obligations）</text>
<text x="46" y="144" font-size="11.5" fill="#4338ca">TTL：60–300 s（可按 resource 敏感度调）</text>
<text x="46" y="164" font-size="11.5" fill="#4338ca">存储：Redis HASH（per-tenant key 隔离）</text>
<text x="46" y="186" font-size="12" font-weight="700" fill="#3730a3">失效时机：</text>
<text x="46" y="206" font-size="11.5" fill="#4338ca">① da_grant 行变更 → 删对应 user 前缀</text>
<text x="46" y="226" font-size="11.5" fill="#4338ca">② da_policy 变更 → FLUSHDB pattern</text>
<text x="46" y="246" font-size="11.5" fill="#4338ca">③ 角色权限变更 → 删 role 关联的所有用户</text>

<text x="612" y="82" font-size="13.5" font-weight="700" fill="#155e75" text-anchor="middle">L2 — 编译产物缓存</text>
<text x="450" y="104" font-size="11.5" fill="#0e7490">键：hash(constraint_ast, backend_type)</text>
<text x="450" y="124" font-size="11.5" fill="#0e7490">值：SQL 模板 + 参数序列（$1 $2…）</text>
<text x="450" y="144" font-size="11.5" fill="#0e7490">TTL：无（编译是纯函数，deterministic）</text>
<text x="450" y="164" font-size="11.5" fill="#0e7490">存储：进程内 LRU（容量 ~1 000 条）</text>
<text x="450" y="186" font-size="12" font-weight="700" fill="#155e75">失效时机：</text>
<text x="450" y="206" font-size="11.5" fill="#0e7490">进程重启（内存 LRU 不持久化）</text>
<text x="450" y="226" font-size="11.5" fill="#0e7490">LRU 自动淘汰</text>
<text x="450" y="246" font-size="11.5" fill="#0e7490">—— 无需主动失效</text>

<text x="40" y="296" font-size="11" fill="#64748b">命中率参考：同部门 / 同角色多用户共享 L1 缓存约束 AST；L2 命中率极高（相同维度集合产出相同 SQL 模板）；结合可预计算：登录时预热 L1 降首次延迟。</text>
</svg>