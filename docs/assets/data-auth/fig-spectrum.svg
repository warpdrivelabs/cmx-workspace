<svg viewBox="0 0 820 372" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
  </marker>
  <filter id="s2" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="372" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="32" font-size="15" font-weight="700" fill="#0f172a">执行点谱系：过滤在“哪里”发生，决定了你有多依赖数据库</text>

<g filter="url(#s2)">
<rect x="30" y="46" width="240" height="228" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
</g>
<rect x="30" y="46" width="240" height="8" rx="4" fill="#10b981"/>
<text x="48" y="76" font-size="13.5" font-weight="700" fill="#065f46">① DB 原生 RLS</text>
<text x="48" y="96" font-size="11.5" fill="#047857">PG CREATE POLICY / VPD</text>
<text x="48" y="118" font-size="11.5" fill="#047857">引擎强制，裸 SQL 也绕不过</text>
<text x="48" y="140" font-size="11.5" fill="#047857">✓ 防绕过最强·单点强制</text>
<text x="48" y="162" font-size="11.5" fill="#b91c1c">✗ 锁 DB · 难测 · 跨服务弱</text>
<text x="48" y="184" font-size="11.5" fill="#b91c1c">✗ 逻辑埋在 PL/pgSQL</text>

<rect x="30" y="244" width="240" height="30" rx="0" fill="#ffffff" fill-opacity="0.4"/>
<text x="48" y="263" font-size="11.5" font-weight="700" fill="#065f46">DB 依赖：极高</text>


<g filter="url(#s2)">
<rect x="290" y="46" width="240" height="228" rx="11" fill="#ecfeff" stroke="#67e8f9"/>
</g>
<rect x="290" y="46" width="240" height="8" rx="4" fill="#06b6d4"/>
<text x="308" y="76" font-size="13.5" font-weight="700" fill="#155e75">② 查询改写下推</text>
<text x="308" y="96" font-size="11.5" fill="#0e7490">拦截器算谓词拼进 WHERE</text>
<text x="308" y="118" font-size="11.5" fill="#0e7490">决策在应用层，DB 只跑 SQL</text>
<text x="308" y="140" font-size="11.5" fill="#0e7490">✓ 可分页 / count / 聚合</text>
<text x="308" y="162" font-size="11.5" fill="#0e7490">✓ DB 可移植（换编译目标）</text>
<text x="308" y="184" font-size="11.5" fill="#b45309">✗ 须能表达成 SQL 且同库</text>

<rect x="290" y="244" width="240" height="30" rx="0" fill="#ffffff" fill-opacity="0.4"/>
<text x="308" y="263" font-size="11.5" font-weight="700" fill="#155e75">DB 依赖：中（可移植）</text>


<g filter="url(#s2)">
<rect x="550" y="46" width="240" height="228" rx="11" fill="#fffbeb" stroke="#fcd34d"/>
</g>
<rect x="550" y="46" width="240" height="8" rx="4" fill="#f59e0b"/>
<text x="568" y="76" font-size="13.5" font-weight="700" fill="#92400e">③ 拉取后过滤</text>
<text x="568" y="96" font-size="11.5" fill="#b45309">取候选行 → 逐行 permit()</text>
<text x="568" y="118" font-size="11.5" fill="#b45309">规则任意复杂，全不碰 DB</text>
<text x="568" y="140" font-size="11.5" fill="#b45309">✓ 彻底 DB 无关</text>
<text x="568" y="162" font-size="11.5" fill="#b91c1c">✗ 过量拉取 · N 次判定</text>
<text x="568" y="184" font-size="11.5" fill="#b91c1c">✗ 无法正确分页 / 聚合</text>

<rect x="550" y="244" width="240" height="30" rx="0" fill="#ffffff" fill-opacity="0.4"/>
<text x="568" y="263" font-size="11.5" font-weight="700" fill="#92400e">DB 依赖：无</text>

<line x1="60" y1="320" x2="760" y2="320" stroke="#94a3b8" stroke-width="1.4" marker-start="url(#a2)" marker-end="url(#a2)"/>
<text x="60" y="344" font-size="11.5" fill="#334155">贴近数据 · 可下推可分页</text>
<text x="760" y="344" font-size="11.5" fill="#334155" text-anchor="end">远离数据 · DB 无关规则任意</text>
<circle cx="150" cy="320" r="5" fill="#10b981"/><circle cx="410" cy="320" r="5" fill="#06b6d4"/><circle cx="670" cy="320" r="5" fill="#f59e0b"/>
</svg>