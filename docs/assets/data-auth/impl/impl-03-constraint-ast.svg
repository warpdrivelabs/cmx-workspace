<svg viewBox="0 0 820 476" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="dn3" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="0">
    <path d="M0,0 L10,0 L5,9 z" fill="#94a3b8"/>
  </marker>
  <filter id="sh3" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="476" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">约束 AST（core::ir）　enum Constraint · #[serde(tag="kind", camelCase)] · 稳定 IR</text>

<!-- left: 9 variants -->
<g filter="url(#sh3)"><rect x="30" y="52" width="352" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="46" y="74" font-size="12" font-weight="700" fill="#334155">九种节点（残差谓词）</text>
<circle cx="52" cy="96" r="4" fill="#10b981"/><text x="64" y="100" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">True</text><text x="150" y="100" font-size="10.5" fill="#64748b">全放行（超管/无限制）</text>
<circle cx="52" cy="120" r="4" fill="#ef4444"/><text x="64" y="124" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">False</text><text x="150" y="124" font-size="10.5" fill="#64748b">全拒绝（无授权/空集）</text>
<circle cx="52" cy="144" r="4" fill="#6366f1"/><text x="64" y="148" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">And { items }</text><text x="204" y="148" font-size="10.5" fill="#64748b">布尔与</text>
<circle cx="52" cy="168" r="4" fill="#6366f1"/><text x="64" y="172" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Or { items }</text><text x="204" y="172" font-size="10.5" fill="#64748b">布尔或</text>
<circle cx="52" cy="192" r="4" fill="#6366f1"/><text x="64" y="196" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Not { item }</text><text x="204" y="196" font-size="10.5" fill="#64748b">布尔非</text>
<circle cx="52" cy="216" r="4" fill="#f59e0b"/><text x="64" y="220" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Cmp { field,op,value }</text><text x="254" y="220" font-size="10.5" fill="#64748b">比较</text>
<circle cx="52" cy="240" r="4" fill="#8b5cf6"/><text x="64" y="244" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">In { field,values }</text><text x="234" y="244" font-size="10.5" fill="#64748b">维度落点</text>
<circle cx="52" cy="264" r="4" fill="#f59e0b"/><text x="64" y="268" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Between { field,lo,hi }</text><text x="254" y="268" font-size="10.5" fill="#64748b">区间</text>
<circle cx="52" cy="288" r="4" fill="#db2777"/><text x="64" y="292" font-size="11" fill="#334155" font-family="ui-monospace,Menlo,Consolas,monospace">Relation { field,rel,subj }</text>
<text x="64" y="312" font-size="10" fill="#9d174d">ReBAC 桥：编译前须经 lookup_resources 解析成 In</text>
<rect x="46" y="322" width="320" height="22" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="56" y="337" font-size="10" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">CmpOp = eq · ne · lt · le · gt · ge · like</text>

<!-- right: example AST tree -->
<g filter="url(#sh3)"><rect x="398" y="52" width="392" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
<text x="414" y="74" font-size="12" font-weight="700" fill="#334155">示例约束树（voucher 读权限）</text>
<!-- And -->
<rect x="560" y="88" width="66" height="30" rx="8" fill="#eef2ff" stroke="#6366f1"/>
<text x="593" y="108" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">And</text>
<!-- In -->
<rect x="416" y="160" width="150" height="76" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="491" y="180" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">In(ou_id)</text>
<text x="491" y="200" font-size="10" fill="#6d28d9" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">[ 1001,</text>
<text x="491" y="214" font-size="10" fill="#6d28d9" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">100101,</text>
<text x="491" y="228" font-size="10" fill="#6d28d9" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">100102 ]</text>
<!-- Or -->
<rect x="656" y="160" width="60" height="30" rx="8" fill="#eef2ff" stroke="#6366f1"/>
<text x="686" y="180" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">Or</text>
<!-- Cmp owner -->
<rect x="600" y="266" width="82" height="54" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
<text x="641" y="285" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Cmp</text>
<text x="641" y="300" font-size="9.5" fill="#b45309" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">owner</text>
<text x="641" y="313" font-size="9.5" fill="#b45309" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">= 'u42'</text>
<!-- Cmp status -->
<rect x="694" y="266" width="86" height="54" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
<text x="737" y="285" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Cmp</text>
<text x="737" y="300" font-size="9.5" fill="#b45309" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">status</text>
<text x="737" y="313" font-size="9.5" fill="#b45309" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">='public'</text>
<!-- tree lines -->
<line x1="580" y1="118" x2="491" y2="160" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#dn3)"/>
<line x1="606" y1="118" x2="686" y2="160" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#dn3)"/>
<line x1="676" y1="190" x2="641" y2="266" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#dn3)"/>
<line x1="696" y1="190" x2="737" y2="266" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#dn3)"/>
<text x="414" y="340" font-size="9.8" fill="#64748b">In 为维度权限落点（$dim:org 展开）；Or 内为属性/所有权分支</text>

<!-- bottom: smart constructors -->
<g filter="url(#sh3)"><rect x="30" y="366" width="760" height="94" rx="10" fill="#f0fdf4" stroke="#86efac"/></g>
<text x="46" y="388" font-size="12" font-weight="700" fill="#166534">智能构造化简（编译前即坍缩常量，PDP 部分求值的代数基础）</text>
<text x="46" y="410" font-size="10.5" fill="#15803d" font-family="ui-monospace,Menlo,Consolas,monospace">Constraint::and()　摊平嵌套 And · 丢弃 True · 任一 False → False · 单元素解包 · 空 → True</text>
<text x="46" y="428" font-size="10.5" fill="#15803d" font-family="ui-monospace,Menlo,Consolas,monospace">Constraint::or()　 摊平嵌套 Or  · 丢弃 False · 任一 True → True · 单元素解包 · 空 → False</text>
<text x="46" y="446" font-size="10.5" fill="#15803d" font-family="ui-monospace,Menlo,Consolas,monospace">Constraint::not()　常量翻转 · 双非消解　｜　空 In → 编译成 FALSE（恒不命中，fail-closed）</text>
</svg>
