<text x="312" y="256" font-size="9.5" fill="#64748b">depends on ▲</text>
<text x="312" y="340" font-size="9.5" fill="#64748b">depends on ▲</text>

<!-- reuse side panel -->
<g filter="url(#sh1)"><rect x="590" y="58" width="200" height="416" rx="11" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="690" y="80" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">跨 workspace path 复用</text>
<rect x="604" y="94" width="172" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="616" y="114" font-size="11" font-weight="700" fill="#334155">../cmx-container</text>
<text x="616" y="134" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-database-pg</text>
<text x="616" y="152" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-core</text>
<text x="616" y="170" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-web-chassis</text>
<text x="616" y="188" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-web-monitor</text>
<text x="616" y="206" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-service-base</text>
<text x="616" y="228" font-size="9.5" fill="#94a3b8">基础设施 · 零业务耦合</text>
<rect x="604" y="256" width="172" height="122" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="616" y="276" font-size="11" font-weight="700" fill="#334155">../cmx-rulesengine</text>
<text x="616" y="296" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-rule-feel</text>
<text x="616" y="314" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-rule-engine</text>
<text x="616" y="332" font-size="10" fill="#475569" font-family="ui-monospace,Menlo,Consolas,monospace">cmx-rule-model</text>
<text x="616" y="354" font-size="9.5" fill="#94a3b8">FEEL 脱敏门 · 决策表</text>
<text x="616" y="371" font-size="9.5" fill="#94a3b8">仅 app 依赖，core 不碰</text>
<text x="690" y="400" font-size="9.8" fill="#64748b" text-anchor="middle">407 crates · 离线 aliyun</text>
<text x="690" y="418" font-size="9.8" fill="#64748b" text-anchor="middle">build/test/clippy 全绿</text>
<text x="690" y="440" font-size="9.8" fill="#64748b" text-anchor="middle">对标 cmx-rulesengine</text>
<text x="690" y="458" font-size="9.8" fill="#64748b" text-anchor="middle">「一芯多壳」骨架</text>
