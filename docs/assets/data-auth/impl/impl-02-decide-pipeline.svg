<line x1="384" y1="196" x2="384" y2="208" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn2)"/>
<line x1="384" y1="246" x2="384" y2="258" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn2)"/>
<line x1="384" y1="310" x2="384" y2="322" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn2)"/>
<line x1="384" y1="360" x2="384" y2="372" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#dn2)"/>
