<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="dn2" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="0">
    <path d="M0,0 L10,0 L5,9 z" fill="#94a3b8"/>
  </marker>
  <filter id="sh2" x="-3%" y="-3%" width="106%" height="110%">
    <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.09"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">engine::decide(Subject, Resource) → Decision　·　七步编排（唯一 async 编排，无 poller）</text>

<!-- input -->
<g filter="url(#sh2)"><rect x="40" y="50" width="360" height="40" rx="9" fill="#eef2ff" stroke="#818cf8"/></g>
<text x="54" y="68" font-size="11" font-weight="700" fill="#3730a3">Subject</text>
<text x="54" y="84" font-size="10" fill="#4338ca" font-family="ui-monospace,Menlo,Consolas,monospace">userId=u42 · roles=[finance]</text>
<g filter="url(#sh2)"><rect x="416" y="50" width="364" height="40" rx="9" fill="#ecfeff" stroke="#22d3ee"/></g>
<text x="430" y="68" font-size="11" font-weight="700" fill="#155e75">Resource</text>
<text x="430" y="84" font-size="10" fill="#0e7490" font-family="ui-monospace,Menlo,Consolas,monospace">kind=voucher · dimBindings{org→ou_id} · read</text>

<!-- steps -->
<!-- template: rect x=150 w=520 -->
<!-- step1 -->
<circle cx="70" cy="126" r="15" fill="#6366f1"/><text x="70" y="131" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<g filter="url(#sh2)"><rect x="98" y="108" width="572" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="112" y="124" font-size="11.5" font-weight="700" fill="#334155">装匹配策略　load_policies(tenant, kind, action)</text>
<text x="112" y="139" font-size="10" fill="#64748b" font-family="ui-monospace,Menlo,Consolas,monospace">→ Vec&lt;PolicyDef&gt;；随后 resolve_policy 把 source=decisionTable 降解为内联模板（D3）</text>
<rect x="676" y="115" width="104" height="24" rx="12" fill="#e0e7ff" stroke="#818cf8"/><text x="728" y="131" font-size="9.5" fill="#3730a3" text-anchor="middle">IO · DB</text>

<!-- step2 -->
<circle cx="70" cy="176" r="15" fill="#6366f1"/><text x="70" y="181" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<g filter="url(#sh2)"><rect x="98" y="158" width="572" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="112" y="174" font-size="11.5" font-weight="700" fill="#334155">装命中主体授权　load_grants(USER=u42 + 每个 ROLE=finance)</text>
<text x="112" y="189" font-size="10" fill="#64748b" font-family="ui-monospace,Menlo,Consolas,monospace">→ Vec&lt;Grant&gt;（策略↔主体+维度根值集）</text>
<rect x="676" y="165" width="104" height="24" rx="12" fill="#e0e7ff" stroke="#818cf8"/><text x="728" y="181" font-size="9.5" fill="#3730a3" text-anchor="middle">IO · DB</text>

<!-- step3 -->
<circle cx="70" cy="226" r="15" fill="#f59e0b"/><text x="70" y="231" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<g filter="url(#sh2)"><rect x="98" y="208" width="572" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d"/></g>
<text x="112" y="224" font-size="11.5" font-weight="700" fill="#92400e">层级维度展开　descendants(org, 1001)</text>
<text x="112" y="239" font-size="10" fill="#b45309" font-family="ui-monospace,Menlo,Consolas,monospace">org=1001 → {1001, 100101, 100102}（下行闭包，含自身）</text>
<rect x="676" y="215" width="104" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b"/><text x="728" y="231" font-size="9" fill="#92400e" text-anchor="middle">WITH RECURSIVE</text>

<!-- step4 -->
<circle cx="70" cy="284" r="15" fill="#8b5cf6"/><text x="70" y="289" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<g filter="url(#sh2)"><rect x="98" y="258" width="572" height="52" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/></g>
<text x="112" y="276" font-size="11.5" font-weight="700" fill="#5b21b6">部分求值　compose(subject, resource, policies, grants, expanded) → 残差约束</text>
<text x="112" y="292" font-size="10" fill="#6d28d9">fail-closed 四门：超管角色→True · 命中 Deny 策略→False · 无匹配策略→Deny</text>
<text x="112" y="305" font-size="10" fill="#6d28d9">空维度授值 → In 坍缩 False（AND 中拒绝，OR 中丢弃保留 public 分支）</text>
<rect x="676" y="271" width="104" height="24" rx="12" fill="#ede9fe" stroke="#8b5cf6"/><text x="728" y="287" font-size="9" fill="#5b21b6" text-anchor="middle">纯函数 · core</text>

<!-- step5 -->
<circle cx="70" cy="340" r="15" fill="#10b981"/><text x="70" y="345" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<g filter="url(#sh2)"><rect x="98" y="322" width="572" height="38" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/></g>
<text x="112" y="338" font-size="11.5" font-weight="700" fill="#065f46">解析 ReBAC 关系　resolve_relations：Relation → lookup_resources → In</text>
<text x="112" y="353" font-size="10" fill="#047857" font-family="ui-monospace,Menlo,Consolas,monospace">object_kind = field 去 _id 后缀；解析后按坍缩同步 effect</text>
<rect x="676" y="329" width="104" height="24" rx="12" fill="#d1fae5" stroke="#10b981"/><text x="728" y="345" font-size="9.5" fill="#065f46" text-anchor="middle">IO · DB</text>

<!-- step6 -->
<circle cx="70" cy="390" r="15" fill="#06b6d4"/><text x="70" y="395" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<g filter="url(#sh2)"><rect x="98" y="372" width="572" height="38" rx="8" fill="#ecfeff" stroke="#67e8f9"/></g>
<text x="112" y="388" font-size="11.5" font-weight="700" fill="#155e75">脱敏义务　build_obligations（角色豁免门 + FEEL condition_expr 门）</text>
<text x="112" y="403" font-size="10" fill="#0e7490" font-family="ui-monospace,Menlo,Consolas,monospace">仅 effect≠Deny 时计算；求值出错 → fail-safe 脱敏</text>
<rect x="676" y="379" width="104" height="24" rx="12" fill="#cffafe" stroke="#06b6d4"/><text x="728" y="395" font-size="9.5" fill="#155e75" text-anchor="middle">FEEL</text>

<!-- step7 -->
<circle cx="70" cy="440" r="15" fill="#64748b"/><text x="70" y="445" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<g filter="url(#sh2)"><rect x="98" y="422" width="572" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="112" y="438" font-size="11.5" font-weight="700" fill="#334155">审计　append_audit(AuditLog)　（非致命，失败仅 warn）</text>
<text x="112" y="453" font-size="10" fill="#64748b" font-family="ui-monospace,Menlo,Consolas,monospace">记录 effect + constraint_json + trace（可解释性）</text>
<rect x="676" y="429" width="104" height="24" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="728" y="445" font-size="9.5" fill="#475569" text-anchor="middle">IO · DB</text>

