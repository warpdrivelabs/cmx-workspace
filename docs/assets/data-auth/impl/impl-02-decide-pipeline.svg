<!-- output -->
<g filter="url(#sh2)"><rect x="40" y="478" width="740" height="62" rx="10" fill="#0f172a"/></g>
<text x="56" y="500" font-size="12" font-weight="700" fill="#e2e8f0">Decision　{ effect, constraint, obligations, trace }</text>
<text x="56" y="520" font-size="10.5" fill="#a5b4fc" font-family="ui-monospace,Menlo,Consolas,monospace">constraint = ou_id IN [1001,100101,100102] AND ( owner = 'u42' OR status = 'public' )</text>
<text x="56" y="534" font-size="10" fill="#94a3b8">effect = permitWithConstraint · obligations = [amount:FULL] · 语义中立的残差 AST，交给多后端编译</text>
</svg>
