<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="dn8" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="0">
    <path d="M0,0 L10,0 L5,9 z" fill="#94a3b8"/>
  </marker>
  <filter id="sh8" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.2" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
</defs>
<rect x="0" y="0" width="820" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="32" font-size="15" font-weight="700" fill="#0f172a">同一 Decision，两种执行形态　—— PEP 中间件（SQL 下推）｜ enforce（内存过滤，不碰 DB）</text>

<!-- shared decision banner -->
<rect x="250" y="46" width="320" height="30" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="410" y="66" font-size="10.8" font-weight="700" fill="#5b21b6" text-anchor="middle">engine::decide → Decision{ constraint, obligations }</text>
<line x1="330" y1="76" x2="220" y2="96" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#dn8)"/>
<line x1="490" y1="76" x2="600" y2="96" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#dn8)"/>

<!-- left: PEP -->
<g filter="url(#sh8)"><rect x="30" y="90" width="372" height="330" rx="10" fill="#ecfeff" stroke="#06b6d4"/></g>
<text x="46" y="112" font-size="12.5" font-weight="700" fill="#155e75">D6 · pep::guard 中间件自动注入</text>
<rect x="46" y="122" width="340" height="40" rx="7" fill="#ffffff" stroke="#67e8f9"/>
<text x="56" y="139" font-size="8.8" fill="#0e7490" font-family="ui-monospace,Menlo,Consolas,monospace">ResourceSpec::new("voucher",Read)</text>
<text x="56" y="153" font-size="8.8" fill="#0e7490" font-family="ui-monospace,Menlo,Consolas,monospace">  .dim("org","ou_id").cols(&amp;["owner","status"])</text>
<!-- steps -->
<rect x="46" y="172" width="340" height="30" rx="7" fill="#cffafe" stroke="#22d3ee"/>
<text x="56" y="191" font-size="9.6" fill="#155e75">① current_subject() ← task_local（tenant/user/roles）</text>
<rect x="46" y="208" width="340" height="30" rx="7" fill="#cffafe" stroke="#22d3ee"/>
<text x="56" y="227" font-size="9.6" fill="#155e75">② engine::decide(subject, resource)</text>
<rect x="46" y="244" width="340" height="30" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
<text x="56" y="263" font-size="9.6" fill="#b91c1c" font-weight="700">③ Deny → 403 短路（不进 handler）</text>
<rect x="46" y="280" width="340" height="30" rx="7" fill="#cffafe" stroke="#22d3ee"/>
<text x="56" y="299" font-size="9.6" fill="#155e75">④ compile("sql") → whereSql + params</text>
<rect x="46" y="316" width="340" height="34" rx="7" fill="#cffafe" stroke="#22d3ee"/>
<text x="56" y="331" font-size="9.4" fill="#155e75">⑤ req.extensions.insert(</text>
<text x="56" y="344" font-size="8.8" fill="#0e7490" font-family="ui-monospace,Menlo,Consolas,monospace">  DataScope{effect,where_sql,params,obligations})</text>
<!-- business handler -->
<rect x="46" y="358" width="340" height="52" rx="7" fill="#0f172a"/>
<text x="56" y="376" font-size="9.4" fill="#7dd3fc" font-weight="700">业务 handler 权限无感</text>
<text x="56" y="392" font-size="8.6" fill="#e2e8f0" font-family="ui-monospace,Menlo,Consolas,monospace">let scope = pep::scope_from(ext)?;</text>
<text x="56" y="405" font-size="8.6" fill="#e2e8f0" font-family="ui-monospace,Menlo,Consolas,monospace">"SELECT … WHERE {scope.where_sql} …" — 不 import 策略</text>

<!-- right: enforce -->
<g filter="url(#sh8)"><rect x="418" y="90" width="372" height="330" rx="10" fill="#ecfdf5" stroke="#10b981"/></g>
<text x="434" y="112" font-size="12.5" font-weight="700" fill="#065f46">archetype-③ · engine::enforce（不碰 DB）</text>
<rect x="434" y="122" width="340" height="40" rx="7" fill="#ffffff" stroke="#6ee7b7"/>
<text x="444" y="139" font-size="8.8" fill="#047857" font-family="ui-monospace,Menlo,Consolas,monospace">POST /enforce { subject, resource, rows }</text>
<text x="444" y="153" font-size="8.8" fill="#047857" font-family="ui-monospace,Menlo,Consolas,monospace">调用方给内存行集（CSV / 跨库 DataSet / API）</text>
<rect x="434" y="172" width="340" height="30" rx="7" fill="#d1fae5" stroke="#34d399"/>
<text x="444" y="191" font-size="9.6" fill="#065f46">① decide → Decision（同左，复用编排）</text>
<rect x="434" y="208" width="340" height="46" rx="7" fill="#d1fae5" stroke="#34d399"/>
<text x="444" y="226" font-size="9.4" fill="#065f46">② pred = RowFilterCompiler.compile(constraint)</text>
<text x="444" y="242" font-size="9.4" fill="#065f46">　 kept = rows.filter(pred)（Deny→False→全过滤）</text>
<rect x="434" y="260" width="340" height="30" rx="7" fill="#d1fae5" stroke="#34d399"/>
<text x="444" y="279" font-size="9.6" fill="#065f46">③ apply_masks(kept, obligations) → 脱敏列</text>
<!-- example -->
<rect x="434" y="298" width="340" height="112" rx="7" fill="#0f172a"/>
<text x="444" y="316" font-size="9.2" fill="#94a3b8" font-family="ui-monospace,Menlo,Consolas,monospace">rows: 100101/u42/draft/100 ← 保留（子孙+owner）</text>
<text x="444" y="332" font-size="9.2" fill="#94a3b8" font-family="ui-monospace,Menlo,Consolas,monospace">      1001/other/public/200 ← 保留（org+public）</text>
<text x="444" y="348" font-size="9.2" fill="#fca5a5" font-family="ui-monospace,Menlo,Consolas,monospace">      9999/u42/draft/300  ← 过滤（org 不在集）</text>
<line x1="444" y1="358" x2="764" y2="358" stroke="#334155"/>
<text x="444" y="376" font-size="9.4" fill="#6ee7b7" font-family="ui-monospace,Menlo,Consolas,monospace">{ kept:2, filtered:1,</text>
<text x="444" y="392" font-size="9.4" fill="#6ee7b7" font-family="ui-monospace,Menlo,Consolas,monospace">  rows:[…, amount:"****"] }</text>
<text x="444" y="406" font-size="8.6" fill="#64748b">同一 constraint：SQL 下推 vs 内存谓词，结果一致</text>

<text x="40" y="440" font-size="10.5" fill="#334155">两条路径证明"<tspan font-weight="700" fill="#5b21b6">决策/执行解耦</tspan>"：<tspan font-family="ui-monospace,Menlo,Consolas,monospace">compile("sql")</tspan> 把约束 AST 下推数据库；<tspan font-family="ui-monospace,Menlo,Consolas,monospace">enforce()</tspan> 把同一 AST 编译成内存谓词就地过滤 —— 无 DB 亦可执行。</text>
<text x="40" y="459" font-size="10.5" fill="#64748b">PEP 中间件让业务 handler 只声明 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">Extension&lt;DataScope&gt;</tspan>，把 where_sql/params 拼进自己的查询，对策略/授权/维度概念完全无感。</text>
</svg>
