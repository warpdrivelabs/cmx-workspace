<!-- legend + notes -->
<text x="40" y="330" font-size="10" fill="#334155">✓ 已接线　△ 可复用 read 路径但未专门接　✗ 缺口</text>
<g filter="url(#g4)"><rect x="40" y="342" width="740" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/></g>
<text x="56" y="364" font-size="10.5" fill="#334155"><tspan font-weight="700" fill="#5b21b6">关键澄清</tspan>：<tspan font-family="ui-monospace,Menlo,Consolas,monospace">decide()</tspan> 对 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">Action::Read/Write/Delete/Export</tspan> 皆成立——缺的是<tspan font-weight="700">下游消费者（执行接缝）</tspan>，不是决策能力。</text>
<text x="56" y="386" font-size="10.5" fill="#334155">#4：写/删需在 UPDATE/DELETE 前用同一 constraint 限定行集（如 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">... WHERE id=? AND {scope}</tspan>）；导出走 read scope + 强制 apply_masks。</text>
<text x="56" y="408" font-size="10.5" fill="#334155">#5：把 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">DataScope</tspan> 接进 cmx-report 取数与 cmx-flow 查询——这是数据权限落地 ERP 的<tspan font-weight="700" fill="#b91c1c">主价值点</tspan>，当前仅 demo 一处消费。</text>
