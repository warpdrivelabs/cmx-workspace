  <filter id="g3" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="820" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="32" font-size="15" font-weight="700" fill="#0f172a">P0 · #3 grant.inherit 被忽略 —— 静默过度授权</text>

<!-- grant -->
<g filter="url(#g3)"><rect x="40" y="54" width="222" height="132" rx="10" fill="#fffbeb" stroke="#f59e0b"/></g>
<text x="56" y="76" font-size="11" font-weight="700" fill="#92400e">输入 Grant</text>
<text x="56" y="98" font-size="9.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">{ subjectType: USER,</text>
<text x="56" y="114" font-size="9.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">  subjectId: u42,</text>
<text x="56" y="130" font-size="9.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">  dimKey: "org",</text>
<text x="56" y="146" font-size="9.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">  dimValues: ["1001"],</text>
<rect x="52" y="154" width="204" height="24" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
<text x="60" y="170" font-size="9.5" fill="#b91c1c" font-family="ui-monospace,Menlo,Consolas,monospace">  inherit: false　← 只授本节点</text>

<!-- org tree -->
<g filter="url(#g3)"><rect x="292" y="54" width="196" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g>
<text x="308" y="76" font-size="11" font-weight="700" fill="#334155">org 维度树</text>
<rect x="312" y="86" width="152" height="26" rx="7" fill="#eef2ff" stroke="#6366f1"/><text x="324" y="103" font-size="10" fill="#3730a3">1001　华东（根）</text>
<rect x="342" y="122" width="122" height="24" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/><text x="354" y="138" font-size="9.5" fill="#475569">100101　上海</text>
<rect x="342" y="152" width="122" height="24" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/><text x="354" y="168" font-size="9.5" fill="#475569">100102　杭州</text>
<path d="M328,112 V134 H342" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<path d="M328,112 V164 H342" fill="none" stroke="#94a3b8" stroke-width="1.3"/>

<!-- expected -->
<g filter="url(#g3)"><rect x="516" y="54" width="264" height="58" rx="10" fill="#ecfdf5" stroke="#10b981"/></g>
<text x="530" y="74" font-size="10.5" font-weight="700" fill="#065f46">语义预期　inherit=false → 仅本节点</text>
<text x="530" y="94" font-size="9.8" fill="#047857" font-family="ui-monospace,Menlo,Consolas,monospace">In(ou_id, [1001])</text>
<text x="530" y="107" font-size="9" fill="#059669">只可见华东本级 ✓</text>

<!-- actual -->
<g filter="url(#g3)"><rect x="516" y="128" width="264" height="66" rx="10" fill="#fef2f2" stroke="#ef4444"/></g>
<text x="530" y="148" font-size="10.5" font-weight="700" fill="#b91c1c">实际　inherit 被忽略 → 展开整棵子树</text>
<text x="530" y="168" font-size="9.8" fill="#991b1b" font-family="ui-monospace,Menlo,Consolas,monospace">In(ou_id, [1001,100101,100102])</text>
<text x="530" y="184" font-size="9.5" font-weight="700" fill="#dc2626">✗ 上海/杭州被误授 → 过度授权</text>

<line x1="262" y1="120" x2="292" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ag3)"/>
<line x1="488" y1="90" x2="516" y2="84" stroke="#10b981" stroke-width="1.5" marker-end="url(#agr3)"/>
<line x1="488" y1="150" x2="516" y2="158" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ard3)"/>

<!-- evidence -->
<g filter="url(#g3)"><rect x="40" y="210" width="740" height="120" rx="10" fill="#0f172a"/></g>
<text x="56" y="232" font-size="11" font-weight="700" fill="#fca5a5">证据　engine.rs · decide 第③步（层级维度展开）</text>
<text x="56" y="254" font-size="9.5" fill="#e2e8f0" font-family="ui-monospace,Menlo,Consolas,monospace">for g in &amp;grants {</text>
<text x="56" y="270" font-size="9.5" fill="#e2e8f0" font-family="ui-monospace,Menlo,Consolas,monospace">    let Some(dim_key) = &amp;g.dim_key else { continue };</text>
<text x="56" y="286" font-size="9.5" fill="#e2e8f0" font-family="ui-monospace,Menlo,Consolas,monospace">    for root in &amp;g.dim_values {  ex.descendants(&amp;tenant, dim_key, &amp;root_s).await …  // ← 从不判 g.inherit</text>
<text x="56" y="302" font-size="9.5" fill="#e2e8f0" font-family="ui-monospace,Menlo,Consolas,monospace">}</text>
<text x="56" y="320" font-size="9" fill="#64748b">pdp.rs::expand_for 同样不看 inherit；store.rs 存/读 inherit 列却无任何消费者 → 字段是"死配置"</text>

<text x="40" y="356" font-size="10.5" fill="#334155">补齐方向：展开前判 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">if g.inherit { descendants } else { vec![root] }</tspan>；`inherit=false` 时仅授根值本身，不下钻。</text>
<text x="40" y="376" font-size="10.5" fill="#64748b">同时补一条冒烟：inherit=false 的 grant 断言 SQL 只含根节点、不含子孙（当前 19 条冒烟未覆盖此路径）。</text>
<text x="40" y="400" font-size="10" fill="#b91c1c">风险等级高：默认 inherit=true 时行为正确，但任何显式设 false 的授权都被静默放大 —— 越授越多、难以察觉。</text>
</svg>
