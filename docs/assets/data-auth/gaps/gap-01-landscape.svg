<text x="40" y="500" font-size="10.5" fill="#334155">红=8 项隐患（多在 P0/P1，须先修）· 琥珀=14 项加固 · 灰=6 项非目标（已知路线）。热度自上而下递减：P0 阻断上线，P4 打磨。</text>
<text x="40" y="520" font-size="10.5" fill="#64748b">下文按 P0→P4 逐项展开：证据（文件:行）· 影响 · 补齐方向。P0 四项先行。</text>
