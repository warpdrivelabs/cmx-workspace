<text x="690" y="80" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">cmx-rulesengine</text>
<text x="690" y="98" font-size="10.5" fill="#6d28d9" text-anchor="middle">FEEL + 决策表作为策略源</text>
<text x="130" y="208" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">cmx-model (DCT/DOC)</text>
<text x="130" y="226" font-size="10.5" fill="#0e7490" text-anchor="middle">资源 kind = voucher/dict 注册</text>
<text x="690" y="208" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">cmx-rpt / cmx-report</text>
<text x="690" y="226" font-size="10.5" fill="#047857" text-anchor="middle">报表取数前注入 WHERE 约束</text>
<text x="130" y="336" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="middle">cmx-portalservice (IAM)</text>
<text x="130" y="354" font-size="10.5" fill="#e11d48" text-anchor="middle">subject 信息来源 · JWT claims</text>
<text x="410" y="336" font-size="12.5" font-weight="700" fill="#86198f" text-anchor="middle">cmx-web-chassis</text>
<text x="410" y="354" font-size="10.5" fill="#a21caf" text-anchor="middle">Axum 中间件自动注入 PEP</text>
<text x="690" y="336" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">cmx-hierarchy</text>
<text x="690" y="354" font-size="10.5" fill="#16a34a" text-anchor="middle">topo_sort 维度展开备选</text>

