<rect x="0" y="0" width="820" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">核心表结构（5 张），均含 tenant_id — 租户内行级权限配置</text>
<g filter="url(#s7)"><rect x="30" y="70" width="220" height="227" rx="9" fill="#eef2ff" stroke="#6366f1"/></g>
<rect x="30" y="70" width="220" height="30" rx="9" fill="#6366f1" fill-opacity="0.22"/>
<text x="42" y="90" font-size="12" font-weight="700" fill="#3730a3">da_policy</text>
<text x="42" y="116" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">PK id bigint</text>
<text x="42" y="135" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">name text NOT NULL</text>
<text x="42" y="154" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">resource_kind text</text>
<text x="42" y="173" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">action text</text>
<text x="42" y="192" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">constraint_json jsonb  -- AST</text>
<text x="42" y="211" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">masks_json jsonb       -- 列脱敏</text>
<text x="42" y="230" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">priority int DEFAULT 0</text>
<text x="42" y="249" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">effect text DEFAULT 'PERMIT'</text>
<text x="42" y="268" font-size="10.5" fill="#3730a3" font-family="ui-monospace,Menlo,Consolas,monospace">tenant_id text</text>
<g filter="url(#s7)"><rect x="290" y="70" width="220" height="208" rx="9" fill="#fffbeb" stroke="#f59e0b"/></g>
<rect x="290" y="70" width="220" height="30" rx="9" fill="#f59e0b" fill-opacity="0.22"/>
<text x="302" y="90" font-size="12" font-weight="700" fill="#92400e">da_grant</text>
<text x="302" y="116" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">PK id bigint</text>
<text x="302" y="135" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">policy_id → da_policy</text>
<text x="302" y="154" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">subject_type text  -- ROLE/USER/ORG</text>
<text x="302" y="173" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">subject_id text</text>
<text x="302" y="192" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">dim_key text      -- org|proj|cost</text>
<text x="302" y="211" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">dim_values jsonb   -- string[]</text>
<text x="302" y="230" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">inherit boolean DEFAULT true</text>
<text x="302" y="249" font-size="10.5" fill="#92400e" font-family="ui-monospace,Menlo,Consolas,monospace">tenant_id text</text>
<g filter="url(#s7)"><rect x="550" y="70" width="220" height="189" rx="9" fill="#ecfdf5" stroke="#10b981"/></g>
<rect x="550" y="70" width="220" height="30" rx="9" fill="#10b981" fill-opacity="0.22"/>
<text x="562" y="90" font-size="12" font-weight="700" fill="#065f46">da_relation_tuple</text>
<text x="562" y="116" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">PK id bigint</text>
<text x="562" y="135" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">object_kind text  -- voucher</text>
<text x="562" y="154" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">object_id text</text>
<text x="562" y="173" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">relation text  -- viewer</text>
<text x="562" y="192" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">subject_kind text -- user</text>
<text x="562" y="211" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">subject_id text</text>
<text x="562" y="230" font-size="10.5" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">tenant_id text</text>
<g filter="url(#s7)"><rect x="30" y="300" width="220" height="208" rx="9" fill="#fdf2f8" stroke="#db2777"/></g>
<rect x="30" y="300" width="220" height="30" rx="9" fill="#db2777" fill-opacity="0.22"/>
<text x="42" y="320" font-size="12" font-weight="700" fill="#9d174d">da_mask_rule</text>
<text x="42" y="346" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">PK id bigint</text>
<text x="42" y="365" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">resource_kind text</text>
<text x="42" y="384" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">column_name text</text>
<text x="42" y="403" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">mask_type text     -- FULL|PARTIAL|HASH</text>
<text x="42" y="422" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">partial_pattern text  -- 131****8800</text>
<text x="42" y="441" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">condition_expr text   -- FEEL</text>
<text x="42" y="460" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">min_role text</text>
<text x="42" y="479" font-size="10.5" fill="#9d174d" font-family="ui-monospace,Menlo,Consolas,monospace">tenant_id text</text>
<g filter="url(#s7)"><rect x="290" y="300" width="220" height="189" rx="9" fill="#ecfeff" stroke="#06b6d4"/></g>
<rect x="290" y="300" width="220" height="30" rx="9" fill="#06b6d4" fill-opacity="0.22"/>
<text x="302" y="320" font-size="12" font-weight="700" fill="#155e75">da_dimension_value</text>
<text x="302" y="346" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">PK id bigint</text>
<text x="302" y="365" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">dim_key text      -- org/proj/cost</text>
<text x="302" y="384" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">dim_value text    -- 维度节点 id</text>
<text x="302" y="403" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">parent_value text -- 层级父 id</text>
<text x="302" y="422" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">label text</text>
<text x="302" y="441" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">depth int</text>
<text x="302" y="460" font-size="10.5" fill="#155e75" font-family="ui-monospace,Menlo,Consolas,monospace">tenant_id text</text>

<line x1="290" y1="120" x2="250" y2="130" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a7)"/>
<line x1="290" y1="158" x2="256" y2="280" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a7)"/>
<text x="386" y="272" font-size="10" fill="#64748b">policy_id FK</text>
<line x1="550" y1="82" x2="510" y2="64" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a7)"/>
<text x="30" y="534" font-size="11" fill="#64748b">da_policy — 策略元数据 + 约束 AST + 列脱敏规则</text>
<text x="30" y="554" font-size="11" fill="#64748b">da_grant — 绑策略到主体+维度 · da_relation_tuple — ReBAC 元组 · da_dimension_value — 层级维度树 · da_mask_rule — 列脱敏</text>
</svg>