<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <filter id="s10" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/></filter>
</defs>
<rect x="0" y="0" width="820" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">多开发者 / 多租户隔离：从「单共享 code-server」升级为「按人分容器」</text>

<!-- 现状 -->
<g filter="url(#s10)"><rect x="30" y="56" width="360" height="150" rx="11" fill="#fef2f2" stroke="#ef4444"/></g>
<text x="210" y="80" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">现状（不足）</text>
<text x="46" y="104" font-size="10.5" fill="#b91c1c">· 单一 code-server（--auth none）</text>
<text x="46" y="124" font-size="10.5" fill="#b91c1c">· 共享 /data/workspace 无隔离</text>
<text x="46" y="144" font-size="10.5" fill="#b91c1c">· 无 k8s / 无动态 spawn</text>
<text x="46" y="164" font-size="10.5" fill="#b91c1c">· 构建在扩展内 child_process</text>
<text x="46" y="186" font-size="10.5" fill="#b91c1c">· 多人协作会互踩</text>

<!-- 目标 -->
<g filter="url(#s10)"><rect x="430" y="56" width="360" height="150" rx="11" fill="#eff6ff" stroke="#60a5fa"/></g>
<text x="610" y="80" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">目标（按人/租户隔离）</text>
<text x="446" y="104" font-size="10.5" fill="#1d4ed8">· 每开发者一 Dev Sandbox（容器/worktree）</text>
<text x="446" y="124" font-size="10.5" fill="#1d4ed8">· 独立工作区 + 认证 + 配额</text>
<text x="446" y="144" font-size="10.5" fill="#1d4ed8">· Build Service 集中编译（隔离沙箱）</text>
<text x="446" y="164" font-size="10.5" fill="#1d4ed8">· 产物按租户命名空间注册</text>
<text x="446" y="186" font-size="10.5" fill="#1d4ed8">· Nginx 路径路由 /codeserver/{dev}/</text>

<line x1="390" y1="131" x2="430" y2="131" stroke="#64748b" stroke-width="1.8" marker-end="url(#a10)"/>
<text x="410" y="123" font-size="9" fill="#64748b" text-anchor="middle">升级</text>

<!-- 运行态隔离 -->
<g filter="url(#s10)"><rect x="30" y="226" width="760" height="150" rx="11" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="46" y="250" font-size="12" font-weight="700" fill="#334155">运行态隔离（与设计态呼应）</text>
<text x="46" y="274" font-size="11" fill="#475569">· 一插件一实例池：崩溃/耗尽影响面锁在单实例，不波及他人</text>
<text x="46" y="296" font-size="11" fill="#475569">· 能力最小授予：不同插件声明不同命名空间，db host 函数按 db_id / 租户库路由</text>
<text x="46" y="318" font-size="11" fill="#475569">· 生命周期事件带 app_id/租户，集群同步按租户广播</text>
<text x="46" y="340" font-size="11" fill="#475569">· 与既有 db-per-tenant（flow/rules/data-auth）一致：租户边界在连接路由，不进业务逻辑</text>
<text x="46" y="362" font-size="11" fill="#64748b">· 载体渐进：M0 单 code-server 沿用 → M1 worktree 隔离 → M2 容器/命名空间隔离（可选 k8s）</text>
</svg>