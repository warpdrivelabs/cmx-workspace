<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="ag6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
  <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  <filter id="s6" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="820" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">调试机制内幕：浏览器断点 → CodeLLDB → DWARF → 宿主内 WASM 实例</text>

<!-- 浏览器 -->
<g filter="url(#s6)"><rect x="30" y="58" width="220" height="150" rx="11" fill="#fffbeb" stroke="#f59e0b"/></g>
<text x="140" y="82" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">浏览器（code-server）</text>
<text x="46" y="106" font-size="10.5" fill="#b45309">· 打断点 / 单步 / 看变量</text>
<text x="46" y="126" font-size="10.5" fill="#b45309">· CodeLLDB 扩展（DAP 客户端）</text>
<text x="46" y="146" font-size="10.5" fill="#b45309">· launch.json（cargo test --no-run）</text>
<text x="46" y="166" font-size="10.5" fill="#b45309">· 前端 debug_triggered</text>
<text x="46" y="186" font-size="10.5" fill="#b45309">  → window.open(codeserver?folder=)</text>

<!-- 编排 -->
<g filter="url(#s6)"><rect x="300" y="58" width="220" height="150" rx="11" fill="#f5f3ff" stroke="#8b5cf6"/></g>
<text x="410" y="82" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">调试编排（宿主）</text>
<text x="316" y="106" font-size="10.5" fill="#6d28d9">· debug_prepare::prepare()</text>
<text x="316" y="126" font-size="10.5" fill="#6d28d9">· PluginQuery 定位 wasm/源码</text>
<text x="316" y="146" font-size="10.5" fill="#6d28d9">· cmx-debug 建会话 + 清理线程</text>
<text x="316" y="166" font-size="10.5" fill="#6d28d9">· is_debugger_attached(pid)</text>
<text x="316" y="186" font-size="10.5" fill="#6d28d9">· 返回 code_server_url+source_path</text>

<!-- 运行时 -->
<g filter="url(#s6)"><rect x="570" y="58" width="220" height="150" rx="11" fill="#ecfeff" stroke="#06b6d4"/></g>
<text x="680" y="82" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">运行时（宿主进程）</text>
<text x="586" y="106" font-size="10.5" fill="#0e7490">· EXTISM_DEBUG=1 保留 DWARF</text>
<text x="586" y="126" font-size="10.5" fill="#0e7490">· Extism 实例（wasmtime）</text>
<text x="586" y="146" font-size="10.5" fill="#0e7490">· call_plugin_function 直调</text>
<text x="586" y="166" font-size="10.5" fill="#0e7490">· cmx_pid 供 LLDB attach</text>
<text x="586" y="186" font-size="10.5" fill="#0e7490">· 断点命中 → 暂停实例</text>

<line x1="250" y1="120" x2="300" y2="120" stroke="#64748b" stroke-width="1.6" marker-end="url(#a6)"/>
<text x="275" y="112" font-size="9" fill="#64748b" text-anchor="middle">触发</text>
<line x1="520" y1="120" x2="570" y2="120" stroke="#64748b" stroke-width="1.6" marker-end="url(#a6)"/>
<text x="545" y="112" font-size="9" fill="#64748b" text-anchor="middle">建会话</text>
<line x1="570" y1="150" x2="250" y2="180" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar6)"/>
<text x="410" y="240" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="700">attach：CodeLLDB ↔ cmx_pid，DWARF 把 wasm 地址映射回 Rust 源码行</text>

<g filter="url(#s6)"><rect x="30" y="262" width="760" height="130" rx="11" fill="#f8fafc" stroke="#cbd5e1"/></g>
<text x="46" y="286" font-size="12" font-weight="700" fill="#334155">相对 ABAP Debugger 的对位与增强</text>
<text x="46" y="310" font-size="11" fill="#475569">· ABAP：内核内置调试器，单步/断点/变量/调用栈　→　CMX：CodeLLDB + DWARF 达到同等单步/断点/变量/栈能力</text>
<text x="46" y="332" font-size="11" fill="#475569">· 增强①：handlers 层纯逻辑可用 <tspan font-family="ui-monospace,Menlo,Consolas,monospace">cargo test</tspan> 免 WASM 直接断点（比 ABAP 单元测试更轻）</text>
<text x="46" y="354" font-size="11" fill="#475569">· 增强②：Rust 编译期类型/借用检查在"改完即生效"之前就拦住大量错误——ABAP 运行期才暴露的问题左移</text>
<text x="46" y="376" font-size="11" fill="#475569">· 缺口→补强：自建 DAP 桥接可摆脱对 code-server 扩展进程存活的依赖（当前 /debug 回调打到扩展 :9000）</text>
</svg>