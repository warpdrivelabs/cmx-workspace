<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <filter id="s8" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/></filter>
</defs>
<rect x="0" y="0" width="820" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">安全沙箱纵深：编译期 → 打包期 → 加载期 → 运行期 四道闸</text>
<g filter="url(#s8)"><rect x="40" y="60" width="172" height="250" rx="11" fill="#eef2ff" stroke="#6366f1"/></g><rect x="40" y="60" width="172" height="34" rx="11" fill="#6366f1" fill-opacity="0.16"/><text x="126" y="82" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">① 编译期</text><text x="54" y="118" font-size="10.5" fill="#3730a3">· Rust 类型/借用检查</text><text x="54" y="144" font-size="10.5" fill="#3730a3">· 无空指针/数据竞争</text><text x="54" y="170" font-size="10.5" fill="#3730a3">· 禁 unsafe（策略)</text><text x="54" y="196" font-size="10.5" fill="#3730a3">· 依赖 crate 审计</text><text x="54" y="222" font-size="10.5" fill="#3730a3">· 错误左移到编码时</text><g filter="url(#s8)"><rect x="232" y="60" width="172" height="250" rx="11" fill="#f5f3ff" stroke="#8b5cf6"/></g><rect x="232" y="60" width="172" height="34" rx="11" fill="#8b5cf6" fill-opacity="0.16"/><text x="318" y="82" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">② 打包期</text><text x="246" y="118" font-size="10.5" fill="#5b21b6">· Ed25519 签名 wasm/manifest</text><text x="246" y="144" font-size="10.5" fill="#5b21b6">· entries 允许清单</text><text x="246" y="170" font-size="10.5" fill="#5b21b6">· 供应商元数据</text><text x="246" y="196" font-size="10.5" fill="#5b21b6">· 版本/依赖声明</text><text x="246" y="222" font-size="10.5" fill="#5b21b6">· 篡改即拒装</text><g filter="url(#s8)"><rect x="424" y="60" width="172" height="250" rx="11" fill="#ecfeff" stroke="#06b6d4"/></g><rect x="424" y="60" width="172" height="34" rx="11" fill="#06b6d4" fill-opacity="0.16"/><text x="510" y="82" font-size="12.5" font-weight="700" fill="#155e75" text-anchor="middle">③ 加载期</text><text x="438" y="118" font-size="10.5" fill="#155e75">· 校验签名+签名者</text><text x="438" y="144" font-size="10.5" fill="#155e75">· 仅声明命名空间可 import</text><text x="438" y="170" font-size="10.5" fill="#155e75">· 未知 import→实例化失败</text><text x="438" y="196" font-size="10.5" fill="#155e75">· 能力最小授予</text><text x="438" y="222" font-size="10.5" fill="#155e75">· 租户库路由绑定</text><g filter="url(#s8)"><rect x="616" y="60" width="172" height="250" rx="11" fill="#ecfdf5" stroke="#10b981"/></g><rect x="616" y="60" width="172" height="34" rx="11" fill="#10b981" fill-opacity="0.16"/><text x="702" y="82" font-size="12.5" font-weight="700" fill="#065f46" text-anchor="middle">④ 运行期</text><text x="630" y="118" font-size="10.5" fill="#065f46">· 内存上限 256MB</text><text x="630" y="144" font-size="10.5" fill="#065f46">· fuel 指令上限</text><text x="630" y="170" font-size="10.5" fill="#065f46">· 超时 30s 熔断</text><text x="630" y="196" font-size="10.5" fill="#065f46">· 调用深度 8+环检测</text><text x="630" y="222" font-size="10.5" fill="#065f46">· 实例级崩溃隔离</text>
<line x1="212" y1="185" x2="232" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a8)"/>
<line x1="404" y1="185" x2="424" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a8)"/>
<line x1="596" y1="185" x2="616" y2="185" stroke="#64748b" stroke-width="1.6" marker-end="url(#a8)"/>
<text x="40" y="342" font-size="11" fill="#64748b">与 ABAP「授权对象 + 命名空间 + 运行期检查」相比，本模型把大量校验前移到编译/打包/加载期——运行期只剩资源熔断。</text>
<text x="40" y="364" font-size="11" fill="#64748b">新增 cmx:http 出站能力时，egress 走域名白名单 + 超时 + 配额，作为运行期第五项资源约束。</text>
<text x="40" y="386" font-size="11" fill="#991b1b">注意：Extism 单模块线性内存模型无内部隔离；跨插件隔离靠"一插件一实例池 + 能力最小授予"实现。</text>
</svg>