<rect x="312" y="300" width="196" height="52" rx="9" fill="#ffffff" stroke="#c4b5fd"/>
<text x="410" y="321" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">POST /api/plugin/deploy</text>
<text x="410" y="339" font-size="10" fill="#6d28d9" text-anchor="middle">校验签名 → 落 DB 注册表</text>
