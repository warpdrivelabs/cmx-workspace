<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <filter id="s7" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/></filter>
</defs>
<rect x="0" y="0" width="820" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">为什么 Rust+WASM 更优 · 四种二次开发载体横评</text>
<!-- 列头 -->
<rect x="30" y="50" width="220" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<rect x="254" y="50" width="130" height="40" rx="8" fill="#eef2ff" stroke="#818cf8"/>
<rect x="388" y="50" width="130" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<rect x="522" y="50" width="130" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="656" y="50" width="130" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="75" font-size="12" font-weight="700" fill="#334155">维度</text>
<text x="319" y="75" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">Rust+WASM</text>
<text x="453" y="75" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">SAP ABAP</text>
<text x="587" y="75" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">JVM 插件</text>
<text x="721" y="75" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">脚本(rhai/JS)</text>
<rect x="30" y="96" width="756" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="50" y="121" font-size="11" font-weight="700" fill="#334155" text-anchor="start">内存/线程安全</text><text x="319" y="121" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">编译期根除</text><text x="453" y="121" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">运行期检查</text><text x="587" y="121" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">GC+运行期</text><text x="721" y="121" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">动态/易错</text><rect x="30" y="140" width="756" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="50" y="165" font-size="11" font-weight="700" fill="#334155" text-anchor="start">沙箱隔离</text><text x="319" y="165" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">WASM 线性内存</text><text x="453" y="165" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">进程/内核信任</text><text x="587" y="165" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">类加载器弱</text><text x="721" y="165" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">解释器内</text><rect x="30" y="184" width="756" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="50" y="209" font-size="11" font-weight="700" fill="#334155" text-anchor="start">性能</text><text x="319" y="209" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">接近原生(AOT)</text><text x="453" y="209" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">解释/字节码</text><text x="587" y="209" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">JIT 预热</text><text x="721" y="209" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">解释慢</text><rect x="30" y="228" width="756" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="50" y="253" font-size="11" font-weight="700" fill="#334155" text-anchor="start">崩溃爆炸半径</text><text x="319" y="253" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">实例级(fuel/超时)</text><text x="453" y="253" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">可拖垮工作进程</text><text x="587" y="253" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">JVM 级</text><text x="721" y="253" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">宿主级</text><rect x="30" y="272" width="756" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="50" y="297" font-size="11" font-weight="700" fill="#334155" text-anchor="start">语言开放度</text><text x="319" y="297" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">开放生态 crates</text><text x="453" y="297" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">专有封闭</text><text x="587" y="297" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">开放但重</text><text x="721" y="297" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">受限 DSL</text><rect x="30" y="316" width="756" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="50" y="341" font-size="11" font-weight="700" fill="#334155" text-anchor="start">冷启动</text><text x="319" y="341" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">毫秒(池化)</text><text x="453" y="341" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">会话常驻</text><text x="587" y="341" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">秒级(JVM)</text><text x="721" y="341" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">毫秒</text><rect x="30" y="360" width="756" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/><text x="50" y="385" font-size="11" font-weight="700" fill="#334155" text-anchor="start">多语言</text><text x="319" y="385" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">WIT 可扩(选配)</text><text x="453" y="385" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">仅 ABAP</text><text x="587" y="385" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">JVM 系</text><text x="721" y="385" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">单一</text><rect x="30" y="404" width="756" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/><text x="50" y="429" font-size="11" font-weight="700" fill="#334155" text-anchor="start">产物可移植</text><text x="319" y="429" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">单文件 .wasm</text><text x="453" y="429" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">锁 SAP 内核</text><text x="587" y="429" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">锁 JVM</text><text x="721" y="429" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">锁宿主</text>
<text x="40" y="462" font-size="11" fill="#64748b">Rust+WASM 兼得脚本的「安全隔离/热替换」与原生的「性能/类型安全」，且不锁定专有内核——这是 ABAP 给不了的开放性。</text>
</svg>