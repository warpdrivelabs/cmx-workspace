<text x="40" y="352" font-size="11" fill="#64748b">现有三入口（绿）已生产可用；新增三入口（蓝）复用同一 invoke 核，仅在 event_bus 订阅器与 cmx-job 消费者里加一层「解析目标插件 → 调 RuntimeInvoker」适配。</text>
<text x="40" y="374" font-size="11" fill="#64748b">流程 serviceTask / 规则 businessRuleTask 挂 WASM 插件，即得「BAdI 式」业务扩展点：标准逻辑不动，扩展逻辑挂钩执行。</text>
