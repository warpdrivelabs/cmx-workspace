<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="ag4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
  <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  <filter id="s4" x="-4%" y="-4%" width="108%" height="112%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="820" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">宿主 ↔ 访客 ABI 边界：依赖反转 + MessagePack + 线性内存偏移</text>

<!-- Guest -->
<g filter="url(#s4)"><rect x="30" y="58" width="330" height="330" rx="12" fill="#ecfdf5" stroke="#10b981"/></g>
<text x="195" y="82" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">访客 WASM（沙箱内）</text>
<rect x="46" y="96" width="298" height="60" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
<text x="60" y="118" font-size="11" fill="#065f46" font-family="ui-monospace,Menlo,Consolas,monospace">#[plugin_fn]</text>
<text x="60" y="136" font-size="10.5" fill="#047857" font-family="ui-monospace,Menlo,Consolas,monospace">fn f(Msgpack&lt;FunctionInput&gt;)</text>
<text x="60" y="150" font-size="10.5" fill="#047857" font-family="ui-monospace,Menlo,Consolas,monospace">  -&gt; FnResult&lt;Msgpack&lt;FunctionOutput&gt;&gt;</text>
<rect x="46" y="166" width="298" height="72" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
<text x="195" y="186" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">三层访客架构（可单测）</text>
<text x="195" y="205" font-size="10" fill="#047857" text-anchor="middle">handlers/ 纯逻辑（泛型 HostFunctions）</text>
<text x="195" y="219" font-size="10" fill="#047857" text-anchor="middle">host.rs 抽象 · extism/ 适配</text>
<text x="195" y="233" font-size="10" fill="#047857" text-anchor="middle">测试用 Mock host 免 WASM</text>
<rect x="46" y="248" width="298" height="60" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
<text x="195" y="270" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">host_calls（SDK 导入）</text>
<text x="195" y="288" font-size="10" fill="#047857" text-anchor="middle">按命名空间 import 宿主函数</text>
<text x="195" y="301" font-size="10" fill="#047857" text-anchor="middle">仅声明的命名空间可用</text>
<rect x="46" y="318" width="298" height="54" rx="9" fill="#f0fdf4" stroke="#86efac"/>
<text x="195" y="339" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">沙箱护栏</text>
<text x="195" y="356" font-size="10" fill="#047857" text-anchor="middle">内存 256MB · fuel · 超时 30s · 深度 8 · 环检测</text>

<!-- Host -->
<g filter="url(#s4)"><rect x="490" y="58" width="300" height="330" rx="12" fill="#eef2ff" stroke="#6366f1"/></g>
<text x="640" y="82" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">宿主 CMX 平台</text>
<rect x="506" y="96" width="268" height="58" rx="9" fill="#ffffff" stroke="#a5b4fc"/>
<text x="640" y="117" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">RuntimeInvoker（trait）</text>
<text x="640" y="135" font-size="10" fill="#4338ca" text-anchor="middle">invoke / load_module / unload</text>
<text x="640" y="148" font-size="10" fill="#4338ca" text-anchor="middle">ExtismEngine 唯一实现</text>
<rect x="506" y="164" width="268" height="94" rx="9" fill="#ffffff" stroke="#a5b4fc"/>
<text x="640" y="185" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">HostFunctionProvider（trait）</text>
<text x="640" y="203" font-size="10" fill="#4338ca" text-anchor="middle">namespace() / functions() / call()</text>
<text x="640" y="221" font-size="10" fill="#4338ca" text-anchor="middle">providers 仅依赖 cmx-traits</text>
<text x="640" y="235" font-size="10" fill="#4338ca" text-anchor="middle">不依赖 extism（可单测/替换引擎）</text>
<text x="640" y="249" font-size="10" fill="#4338ca" text-anchor="middle">MsgPack 编解码</text>
<rect x="506" y="268" width="268" height="104" rx="9" fill="#ffffff" stroke="#a5b4fc"/>
<text x="640" y="289" font-size="11" font-weight="700" fill="#3730a3" text-anchor="middle">能力命名空间</text>
<text x="640" y="307" font-size="10" fill="#4338ca" text-anchor="middle">cmx:log · cmx:database（事务）</text>
<text x="640" y="321" font-size="10" fill="#4338ca" text-anchor="middle">cmx:buffer · cmx:iam</text>
<text x="640" y="335" font-size="10" fill="#4338ca" text-anchor="middle">cmx:plugin（plugin/service 调用）</text>
<text x="640" y="352" font-size="10" fill="#1d4ed8" text-anchor="middle">★ cmx:http（新增，egress 白名单）</text>
<text x="640" y="366" font-size="9" fill="#64748b" text-anchor="middle">未声明命名空间 → 实例化即失败</text>

<!-- 双向箭头 -->
<line x1="360" y1="150" x2="490" y2="125" stroke="#64748b" stroke-width="1.8" marker-end="url(#a4)"/>
<text x="425" y="128" font-size="10" fill="#334155" text-anchor="middle">调用 f()</text>
<line x1="490" y1="315" x2="360" y2="278" stroke="#10b981" stroke-width="1.8" marker-end="url(#ag4)"/>
<text x="425" y="312" font-size="10" fill="#065f46" text-anchor="middle">host 回调</text>
<text x="425" y="200" font-size="10" fill="#64748b" text-anchor="middle">I64 偏移</text>
<text x="425" y="216" font-size="10" fill="#64748b" text-anchor="middle">+ 线性内存</text>
</svg>