<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  <marker id="ab3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <filter id="s3" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/></filter>
</defs>
<rect x="0" y="0" width="820" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">W2 · 调试自持：从"依赖扩展 :9000"到"平台自建 DAP 桥"</text>
<!-- 现状 -->
<text x="40" y="66" font-size="12.5" font-weight="700" fill="#991b1b">现状（单点脆弱）</text>
<g filter="url(#s3)">
<rect x="40" y="76" width="150" height="52" rx="9" fill="#fffbeb" stroke="#f59e0b"/>
<rect x="250" y="76" width="170" height="52" rx="9" fill="#fef2f2" stroke="#ef4444"/>
<rect x="480" y="76" width="150" height="52" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
<rect x="670" y="76" width="110" height="52" rx="9" fill="#ecfeff" stroke="#06b6d4"/></g>
<text x="115" y="98" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">浏览器 CodeLLDB</text>
<text x="115" y="115" font-size="9.5" fill="#b45309" text-anchor="middle">window.open</text>
<text x="335" y="98" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">扩展 Express :9000</text>
<text x="335" y="115" font-size="9.5" fill="#b91c1c" text-anchor="middle">/debug 回调（进程须存活）</text>
<text x="555" y="98" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">cmx-debug 会话</text>
<text x="555" y="115" font-size="9.5" fill="#6d28d9" text-anchor="middle">debug_prepare</text>
<text x="725" y="98" font-size="11" font-weight="700" fill="#155e75" text-anchor="middle">wasm 实例</text>
<text x="725" y="115" font-size="9.5" fill="#0e7490" text-anchor="middle">DWARF</text>
<line x1="190" y1="102" x2="250" y2="102" stroke="#64748b" stroke-width="1.4" marker-end="url(#a3)"/>
<line x1="420" y1="102" x2="480" y2="102" stroke="#64748b" stroke-width="1.4" marker-end="url(#a3)"/>
<line x1="630" y1="102" x2="670" y2="102" stroke="#64748b" stroke-width="1.4" marker-end="url(#a3)"/>
<text x="335" y="146" font-size="9.5" fill="#b91c1c" text-anchor="middle">✗ 扩展进程挂 → 调试链断</text>
<line x1="40" y1="166" x2="780" y2="166" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
<!-- 目标 -->
<text x="40" y="192" font-size="12.5" font-weight="700" fill="#1e40af">目标（平台自持）</text>
<g filter="url(#s3)">
<rect x="40" y="202" width="150" height="56" rx="9" fill="#fffbeb" stroke="#f59e0b"/>
<rect x="250" y="202" width="180" height="56" rx="9" fill="#eff6ff" stroke="#2563eb"/>
<rect x="490" y="202" width="150" height="56" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
<rect x="670" y="202" width="110" height="56" rx="9" fill="#ecfeff" stroke="#06b6d4"/></g>
<text x="115" y="226" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">浏览器 DAP 客户端</text>
<text x="115" y="243" font-size="9.5" fill="#b45309" text-anchor="middle">WebSocket → 平台</text>
<text x="340" y="224" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">★ cmx-dap 桥（平台内）</text>
<text x="340" y="241" font-size="9.5" fill="#1d4ed8" text-anchor="middle">DAP 服务端 · 认证 · 会话</text>
<text x="340" y="253" font-size="9.5" fill="#1d4ed8" text-anchor="middle">复用 cmx-debug</text>
<text x="565" y="226" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">LLDB attach</text>
<text x="565" y="243" font-size="9.5" fill="#6d28d9" text-anchor="middle">cmx_pid</text>
<text x="725" y="226" font-size="11" font-weight="700" fill="#155e75" text-anchor="middle">wasm 实例</text>
<text x="725" y="243" font-size="9.5" fill="#0e7490" text-anchor="middle">DWARF 映射</text>
<line x1="190" y1="230" x2="250" y2="230" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab3)"/>
<line x1="430" y1="230" x2="490" y2="230" stroke="#64748b" stroke-width="1.4" marker-end="url(#a3)"/>
<line x1="640" y1="230" x2="670" y2="230" stroke="#64748b" stroke-width="1.4" marker-end="url(#a3)"/>
<text x="40" y="300" font-size="11" fill="#64748b">收益：调试入口收敛到平台（认证+审计+多会话），不再依赖扩展 Express 进程存活；code-server 仍作编辑器，但断点协议由平台托管。</text>
<text x="40" y="322" font-size="11" fill="#64748b">渐进：W2-a 先稳态化现有 cmx-debug + 核实 /debug 链路；W2-b 再引入 cmx-dap 服务端 DAP 桥（最难，可延后）。</text>
<text x="40" y="344" font-size="11" fill="#991b1b">风险：WASM 源码级调试依赖 DWARF 完整性与 LLDB 版本；自建 DAP 工作量大，务必先量化 W2-b ROI 再投入。</text>
</svg>