<text x="30" y="30" font-size="15" font-weight="700" fill="#0f172a">W1 · 服务端编译流水线（Build Service）时序 —— 取代本地 cargo / 扩展内 cp.exec</text>
<rect x="0" y="46" width="820" height="58" fill="#fffbeb" fill-opacity="0.5" stroke="#e2e8f0" stroke-width="0.6"/><text x="10" y="79" font-size="10" font-weight="700" fill="#92400e" transform="rotate(-90,10,79)" text-anchor="middle">开发者</text>
