<text x="30" y="374" font-size="11" fill="#64748b">Build Service 独立于请求路径（平台运行时不 spawn 进程）；编译在隔离沙箱执行，产物经既有 /api/plugin/deploy 落库。缓存 target/ 与 crates 加速增量构建。</text>
