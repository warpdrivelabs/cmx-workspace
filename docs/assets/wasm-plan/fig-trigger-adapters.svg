  <filter id="s4" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.09"/></filter>
</defs>
<rect x="0" y="0" width="820" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="40" y="34" font-size="15" font-weight="700" fill="#0f172a">W3 · 触发面泛化：三类新入口经"薄适配器"汇入既有 invoke 核</text>
<g filter="url(#s4)"><rect x="40" y="60" width="228" height="52" rx="9" fill="#eff6ff" stroke="#60a5fa"/></g><text x="56" y="80" font-size="11.5" font-weight="700" fill="#1e40af">★ 事件订阅适配</text><text x="56" y="98" font-size="9.5" fill="#1e40af" opacity="0.85">event_bus 主题 → plugin_event_binding</text><g filter="url(#s4)"><rect x="40" y="126" width="228" height="52" rx="9" fill="#eff6ff" stroke="#60a5fa"/></g><text x="56" y="146" font-size="11.5" font-weight="700" fill="#1e40af">★ 定时适配</text><text x="56" y="164" font-size="9.5" fill="#1e40af" opacity="0.85">cmx-job cron → plugin_cron_binding</text><g filter="url(#s4)"><rect x="40" y="192" width="228" height="52" rx="9" fill="#eff6ff" stroke="#60a5fa"/></g><text x="56" y="212" font-size="11.5" font-weight="700" fill="#1e40af">★ 业务钩子</text><text x="56" y="230" font-size="9.5" fill="#1e40af" opacity="0.85">flow serviceTask / rules businessRule</text>
<g filter="url(#s4)"><rect x="316" y="120" width="190" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/></g>
<text x="411" y="146" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">薄适配层（新增）</text>
<text x="411" y="166" font-size="9.5" fill="#6d28d9" text-anchor="middle">解析绑定 → 构 FunctionInput</text>
<text x="411" y="182" font-size="9.5" fill="#6d28d9" text-anchor="middle">经 FunctionInvoker trait</text>
<text x="411" y="196" font-size="9" fill="#991b1b" text-anchor="middle">(避免把 extism 拉进 cmx-job-core)</text>
<g filter="url(#s4)"><rect x="554" y="100" width="226" height="52" rx="10" fill="#eef2ff" stroke="#6366f1"/></g>
<text x="667" y="122" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">cmx_biz::invoke_plugin_function</text>
<text x="667" y="140" font-size="9.5" fill="#4338ca" text-anchor="middle">已有调用核（三入口共用）</text>
<g filter="url(#s4)"><rect x="554" y="168" width="226" height="52" rx="10" fill="#ecfeff" stroke="#06b6d4"/></g>
<text x="667" y="190" font-size="11.5" font-weight="700" fill="#155e75" text-anchor="middle">RuntimeInvoker → ExtismEngine</text>
<text x="667" y="208" font-size="9.5" fill="#0e7490" text-anchor="middle">池化实例 · 护栏 · host 回调</text>
<line x1="268" y1="86" x2="316" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#a4)"/><line x1="268" y1="152" x2="316" y2="150" stroke="#64748b" stroke-width="1.2" marker-end="url(#a4)"/><line x1="268" y1="218" x2="316" y2="175" stroke="#64748b" stroke-width="1.2" marker-end="url(#a4)"/>
<line x1="506" y1="150" x2="554" y2="128" stroke="#64748b" stroke-width="1.4" marker-end="url(#a4)"/>
<line x1="667" y1="152" x2="667" y2="168" stroke="#64748b" stroke-width="1.4" marker-end="url(#a4)"/>
<text x="40" y="300" font-size="11" fill="#64748b">已有三入口（HTTP/编排 DAG/RPC）不改；新增三入口只加"绑定表 + 薄适配器"。业务钩子经 flow/rules 微服务 HTTP 调 /api/service/call。</text>
<text x="40" y="322" font-size="11" fill="#64748b">新增两张绑定表：cmx_plugin_event_binding（topic→plugin/fn）、cmx_plugin_cron_binding（cron→plugin/fn），支持启停/租户维度。</text>
<text x="40" y="344" font-size="11" fill="#991b1b">关键约束：cmx-job-core 刻意不依赖 extism —— 适配器经 cmx-traits::FunctionInvoker 间接调用，保持该边界不被破坏。</text>
</svg>